<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Editing | Ridwan.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cursor" id="custom-cursor"></div>
    <nav class="minimal-nav">
        <a href="index.html">← Back to Home</a>
    </nav>

    <header class="project-header">
        <h1>01. Photo Editing</h1>
        <p>Color grading and raw image retouching.</p>
    </header>

    <section class="project-gallery">
        <!-- Change 'photo-1.jpg' if your file name is different -->
        <img src="photo-edit-1.jpg" alt="Photo edit example 1" class="gallery-img">
        
        <!-- Change 'photo-2.jpg' to your second image -->
        <img src="photo-edit-2.jpg" alt="Photo edit example 2" class="gallery-img">

        <img src="photo-edit-3.jpg" alt="Photo edit example 3" class="gallery-img">

        <img src="photo-edit-4.jpg" alt="Photo edit example 4" class="gallery-img">

        <img src="photo-edit-5.jpg" alt="Photo edit example 5" class="gallery-img">

        <img src="photo-edit-6.jpg" alt="Photo edit example 6" class="gallery-img">

        <img src="photo-edit-7.jpg" alt="Photo edit example 7" class="gallery-img">
    </section>

    <footer class="minimal-footer">
        <div class="footer-grid">
            <p>Ridwan © 2026 | Sawangan, Depok</p>
            <a href="mailto:koengahhmaed@gmail.com">koengahhmaed@gmail.com</a>
        </div>
    </footer>
    <script>
        const cursor = document.getElementById('custom-cursor');
        const interactiveElements = document.querySelectorAll('a, button, .gallery-img, h1');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
        });
    </script>
</body>
</html>
